spring.application.name=portfolio-api

# Carga .env (sin secretos) y luego .env.local (con la contraseña local).
spring.config.import=optional:file:./.env[.properties],optional:file:./.env.local[.properties]

server.port=${SERVER_PORT:7070}

spring.datasource.url=${ORACLE_DB_URL}
spring.datasource.username=${ORACLE_DB_USERNAME}
spring.datasource.password=${ORACLE_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# La API valida que las tablas y columnas existan, pero nunca las crea ni modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.pool-name=PortfolioOraclePool
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# Healthcheck de base de datos: http://localhost:7070/actuator/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true

# Orígenes autorizados para el frontend; varios valores se separan con comas.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
